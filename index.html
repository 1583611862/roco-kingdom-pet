<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洛克王国：世界 宠物图鉴</title>
  <link rel="stylesheet" href="style.css">

  <!-- favicon 小图标 -->
  <link rel="icon" href="public/leologo/leo_favicon.png" type="image/png">
  <link rel="shortcut icon" href="public/leologo/leo_favicon.png" type="image/png">

</head>
<body>

<!-- 顶部导航：左侧标题 + 右侧菜单 -->
<div class="top-bar">
  <h1>洛克王国：世界 宠物图鉴</h1>

  <div class="top-menu">
    <button class="top-menu-btn" onclick="location.href='index.html'">
      <img src="public/leologo/pet_icon.png" class="menu-icon" alt="图鉴">
      宠物图鉴
    </button>
    <button class="top-menu-btn" onclick="location.href='weakness.html'">
       <img src="public/leologo/element_icon.png" class="menu-icon">属性克制
    </button>
    <button class="top-menu-btn" onclick="location.href='ranking.html'">
      <img src="public/leologo/ranking_icon.png" class="menu-icon">
      种族值
    </button>
  </div>
</div>

<!-- 内容区域 -->
<div class="content">
  <div class="page-container">
    <div class="user-info-bar">
      <span>您的用户令牌：</span>
      <code id="userTokenDisplay"></code>
      <button class="copy-token-btn" onclick="copyUserToken()">📋 复制</button>
      <button class="import-token-btn" onclick="showImportDialog()">📥 导入令牌</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 输入名称或编号搜索..." oninput="handleSearch(this.value)">
    </div>
    <div class="fav-filter-bar">
      <button class="fav-filter-btn active" id="btnAll" onclick="setFilter('全部')">全部</button>
      <button class="fav-filter-btn" id="btnFav" onclick="setFilter('喜爱')">⭐ 已喜爱</button>
      <button class="fav-filter-btn" id="btnNotFav" onclick="setFilter('未喜爱')">☆ 未喜爱</button>
    </div>
    <div class="filter-wrapper">
      <div class="filter-bar desktop-filter" id="filterBar"></div>
      <select class="filter-select mobile-filter" id="filterSelect" onchange="handleSelectChange(this)">
        <option value="全部">全部属性</option>
      </select>
    </div>
    <div class="pet-grid" id="petGrid"></div>
  </div>
</div>

<!-- 导入令牌对话框 -->
<div id="importModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>📥 导入用户令牌</h3>
    <p>如果您之前复制过令牌，可以粘贴到下方来恢复您的喜爱数据：</p>
    <textarea id="importTokenInput" rows="4" placeholder="粘贴令牌，例如：user_xxx_xxx"></textarea>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeImportDialog()">取消</button>
      <button class="modal-btn confirm" onclick="importUserToken()">确认导入</button>
    </div>
  </div>
</div>

<!-- 返回顶部按钮 -->
<button id="backToTop" onclick="scrollToTop()">↑</button>

<script src="data/load-pets.js"></script>

<script>
const petList = [...petList1, ...petList2, ...petList3, ...petList4, ...petList5, 
...petList6, ...petList7, ...petList8, ...petList9, ...petList10,
...petList11, ...petList12, ...petList13, ...petList14, ...petList15, 
...petList16, ...petList17, ...petList18, ...petList19, ...petList20,
...petList21, ...petList22, ...petList23, ...petList24, ...petList25, 
...petList26, ...petList27, ...petList28, ...petList29, ...petList30,
...petList31, ...petList32, ...petList33, ...petList34, ...petList35,
];

// ========== 用户令牌系统 ==========
const USER_TOKEN_KEY = 'roco_user_token';

function generateUserToken() {
  const timestamp = Date.now().toString(36);
  const random = Math.random().toString(36).substring(2, 15);
  return `user_${timestamp}_${random}`;
}

function getUserToken() {
  let token = localStorage.getItem(USER_TOKEN_KEY);
  if (!token) {
    token = generateUserToken();
    localStorage.setItem(USER_TOKEN_KEY, token);
  }
  return token;
}

function getFavoritesKey() {
  return `roco_favorites_${getUserToken()}`;
}

// ========== 喜爱功能 - 本地存储管理（支持多用户） ==========
function getFavorites() {
  const saved = localStorage.getItem(getFavoritesKey());
  return saved ? JSON.parse(saved) : [];
}

function isFavorite(petId) {
  return getFavorites().includes(petId);
}

function toggleFavorite(petId) {
  let favorites = getFavorites();
  const index = favorites.indexOf(petId);
  if (index > -1) {
    favorites.splice(index, 1);
  } else {
    favorites.push(petId);
  }
  localStorage.setItem(getFavoritesKey(), JSON.stringify(favorites));
  renderPets(currentFilter === '喜爱' ? getFavoritePets() : (currentFilter === '全部' ? petList : getFilteredPets(currentFilter)));
  renderFilters();
}

function getFavoritePets() {
  const favorites = getFavorites();
  return petList.filter(p => favorites.includes(p.id));
}

function getNotFavoritePets() {
  const favorites = getFavorites();
  return petList.filter(p => !favorites.includes(p.id));
}

function getFilteredPets(type) {
  if (type === '全部') return petList;
  if (type === '喜爱') return getFavoritePets();
  if (type === '未喜爱') return getNotFavoritePets();
  return petList.filter(p => {
    const el = p.element;
    return Array.isArray(el) ? el.includes(type) : el === type;
  });
}

// ========== 页面初始化 ==========
document.getElementById('userTokenDisplay').textContent = getUserToken();

function copyUserToken() {
  const token = getUserToken();
  navigator.clipboard.writeText(token).then(() => {
    alert('令牌已复制到剪贴板！\n如果换浏览器或设备，需要导入此令牌才能恢复喜爱数据。');
  }).catch(() => {
    prompt('复制以下令牌：', token);
  });
}

function showImportDialog() {
  document.getElementById('importModal').style.display = 'flex';
}

function closeImportDialog() {
  document.getElementById('importModal').style.display = 'none';
  document.getElementById('importTokenInput').value = '';
}

function importUserToken() {
  const newToken = document.getElementById('importTokenInput').value.trim();
  if (!newToken) {
    alert('请输入有效的令牌！');
    return;
  }
  
  if (confirm('确认导入令牌？\n这将切换到新的用户身份，当前设备的喜爱数据会保留。')) {
    localStorage.setItem(USER_TOKEN_KEY, newToken);
    alert('令牌导入成功！');
    closeImportDialog();
    location.reload();
  }
}

let currentFilter = '全部';
let currentElementFilter = '全部';
let currentSearch = '';
let searchTimeout = null;

renderFilters();
renderPets(petList);

// ========== 新增喜爱筛选相关 ==========
function setFilter(filterType) {
  currentFilter = filterType;
  
  // 更新按钮状态
  document.querySelectorAll('.fav-filter-btn').forEach(btn => btn.classList.remove('active'));
  if (filterType === '全部') {
    document.getElementById('btnAll').classList.add('active');
  } else if (filterType === '喜爱') {
    document.getElementById('btnFav').classList.add('active');
  } else if (filterType === '未喜爱') {
    document.getElementById('btnNotFav').classList.add('active');
  }
  
  performSearch();
}

function handleSelectChange(selectEl) {
  currentElementFilter = selectEl.value;
  // 需要同时更新桌面端的按钮
  document.querySelectorAll('.desktop-filter .filter-btn').forEach(btn => {
    if (btn.dataset.type === selectEl.value) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  performSearch();
}

// ========== 搜索功能 ==========
function handleSearch(value) {
  currentSearch = value.trim().toLowerCase();
  
  if (searchTimeout) {
    clearTimeout(searchTimeout);
  }
  
  searchTimeout = setTimeout(() => {
    performSearch();
  }, 300);
}

function performSearch() {
  let filteredPets = petList;
  
  // 首先应用喜爱筛选
  if (currentFilter === '喜爱') {
    filteredPets = getFavoritePets();
  } else if (currentFilter === '未喜爱') {
    filteredPets = getNotFavoritePets();
  } else {
    filteredPets = petList;
  }
  
  // 然后应用属性筛选
  if (currentElementFilter !== '全部') {
    filteredPets = filteredPets.filter(p => {
      const el = p.element;
      return Array.isArray(el) ? el.includes(currentElementFilter) : el === currentElementFilter;
    });
  }
  
  // 最后应用搜索
  if (currentSearch) {
    filteredPets = filteredPets.filter(pet => {
      const nameMatch = pet.name.toLowerCase().includes(currentSearch);
      const idMatch = pet.id.toString().includes(currentSearch);
      return nameMatch || idMatch;
    });
  }
  
  renderPets(filteredPets);
}

// ========== 筛选功能 ==========
function renderFilters() {
  const bar = document.getElementById("filterBar");
  const select = document.getElementById("filterSelect");
  // 先清空
  bar.innerHTML = "";
  select.innerHTML = `<option value="全部">全部属性</option>`;

  allElements.forEach(el => {
    // 桌面端按钮
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.dataset.type = el;

    if (el !== "全部" && elementColors[el]) {
      btn.style.backgroundColor = "#fff";
      btn.style.color = elementColors[el];
      btn.style.border = `2px solid ${elementColors[el]}`;
      btn.innerHTML = `<img src="public/icons/${el}.png" class="filter-icon">${el}`;
    } else {
      btn.textContent = el;
      btn.style.border = `2px solid #ccc`;
    }

    if (el === currentElementFilter) {
      btn.classList.add('active');
    }

    // 点击切换 active
    btn.onclick = (e) => {
      e.stopPropagation();
      currentElementFilter = el;
      document.querySelectorAll(".desktop-filter .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      select.value = el;
      performSearch();
    };

    bar.appendChild(btn);
    
    // 手机端下拉框选项
    const option = document.createElement("option");
    option.value = el;
    option.textContent = el;
    select.appendChild(option);
  });
}

function renderPets(pets) {
  const grid = document.getElementById("petGrid");
  grid.innerHTML = "";
  pets.forEach(pet => {
    const card = document.createElement("div");
    card.className = "small-card";
    const elems = Array.isArray(pet.element) ? pet.element : [pet.element];
    const bg = elems.length === 1 ? elementColors[elems[0]] : `linear-gradient(135deg, ${elementColors[elems[0]]}, ${elementColors[elems[1]]})`;
    const favorited = isFavorite(pet.id);

    card.innerHTML = `
    <div class="card-header">
      <button class="favorite-btn ${favorited ? 'favorited' : ''}" onclick="event.stopPropagation(); toggleFavorite(${pet.id});">
        ${favorited ? '⭐' : '☆'}
      </button>
    </div>
    <div class="pet-id">No.${pet.id}</div>
    <div class="avatar-box" style="background:${bg}">
      <img class="avatar" src="public/images/${pet.id}.png" alt="${pet.name}">
    </div>
    <div class="pet-name">${pet.name}</div>
    <div class="element-icons">
      ${elems.map(e => `<img src="public/icons/${e}.png" alt="${e}" class="element-small-icon">`).join('')}
    </div>
  `;
    card.onclick = () => location.href = `detail.html?id=${pet.id}`;
    grid.appendChild(card);
  });
}

// ========== 返回顶部功能 ==========
function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

// 滚动时显示/隐藏按钮
window.onscroll = function() {
  const btn = document.getElementById("backToTop");
  if (document.documentElement.scrollTop > 300) {
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
};

</script>
